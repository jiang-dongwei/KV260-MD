name: Private tool cache access
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Read private runtime with repository token
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_CONFIG: ${{ runner.temp }}/md-cache-auth
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DOCKER_CONFIG"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          IMAGE=ghcr.io/jiang-dongwei/kria-kv260-vivado-2026@sha256:9aba1b46179698cf9a75df5ed7dd15d749063f29a2603420a17e856c9bc08f43
          docker pull "$IMAGE"
          docker run --rm --entrypoint uname "$IMAGE" -m
